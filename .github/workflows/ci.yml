name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --if-present

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Dummy values: build must not require live secrets.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/upcai
          JWT_PRIVATE_KEY: ci-dummy
          JWT_PUBLIC_KEY: ci-dummy
